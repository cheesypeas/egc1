<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" fill="none">
  <title>How the first note loop is timed</title>
  <desc>Arming starts a waiting period. The first note starts recording. Pressing the Loop button finishes the phrase and starts playback. The base-loop length is measured only between the first note and the finish press.</desc>
  <rect width="1000" height="290" fill="#080e09"/>
  <g font-family="monospace" font-size="17" fill="#dcebd7"><text x="55" y="45">TAP LOOP</text><text x="300" y="45">FIRST NOTE</text><text x="710" y="45">TAP LOOP AGAIN</text></g>
  <g stroke="#446540"><path d="M66 61V176"/><path d="M313 61V176"/><path d="M729 61V176"/></g>
  <path d="M66 120H313" stroke="#6b8265" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M313 120H729" stroke="#6aff6a" stroke-width="3"/>
  <path d="M729 120H942M932 112L944 120L932 128" stroke="#8bbfff" stroke-width="2"/>
  <g fill="#6aff6a"><rect x="313" y="92" width="37" height="28" rx="3"/><rect x="403" y="92" width="27" height="28" rx="3"/><rect x="456" y="92" width="65" height="28" rx="3"/><rect x="584" y="92" width="36" height="28" rx="3"/></g>
  <circle cx="66" cy="120" r="6" fill="#a0b29e"/><circle cx="313" cy="120" r="6" fill="#6aff6a"/><circle cx="729" cy="120" r="6" fill="#8bbfff"/>
  <g font-family="monospace" font-size="16" text-anchor="middle"><text x="183" y="156" fill="#a0b29e">Armed · waiting</text><text x="520" y="156" fill="#6aff6a">Recording your phrase</text><text x="842" y="156" fill="#8bbfff">Playback →</text></g>
  <path d="M313 194V207H729V194" stroke="#6aff6a" stroke-width="1.5"/>
  <text x="521" y="239" fill="#dcebd7" font-family="monospace" font-size="18" text-anchor="middle">THIS BECOMES YOUR BASE LOOP</text>
  <text x="521" y="268" fill="#a0b29e" font-family="monospace" font-size="14" text-anchor="middle">The waiting time before the first note is excluded.</text>
</svg>
